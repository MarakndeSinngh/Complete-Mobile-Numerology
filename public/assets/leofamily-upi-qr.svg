    <rect x="190" y="310" width="20" height="12" rx="2"/>
    <rect x="230" y="310" width="35" height="12" rx="2"/>
    <rect x="280" y="310" width="20" height="12" rx="2"/>
    <rect x="310" y="310" width="30" height="12" rx="2"/>

