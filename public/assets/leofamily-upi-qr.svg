    <rect x="180" y="270" width="20" height="12" rx="2"/>
    <rect x="220" y="270" width="30" height="12" rx="2"/>
    <rect x="270" y="270" width="20" height="12" rx="2"/>
    <rect x="310" y="270" width="30" height="12" rx="2"/>

    <rect x="130" y="290" width="20" height="12" rx="2"/>
    <rect x="170" y="290" width="35" height="12" rx="2"/>
    <rect x="225" y="290" width="20" height="12" rx="2"/>
    <rect x="260" y="290" width="40" height="12" rx="2"/>
    <rect x="320" y="290" width="20" height="12" rx="2"/>

