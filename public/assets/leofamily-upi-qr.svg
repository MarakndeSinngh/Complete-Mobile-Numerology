<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="400" rx="24" fill="#FFFFFF" filter="url(#shadow)" stroke="#FDE68A" stroke-width="4"/>

  <!-- Top Banner -->
  <rect x="16" y="16" width="368" height="44" rx="12" fill="url(#goldGrad)" />
  <text x="200" y="44" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">
    LEOFAMILY • ₹33 MASTER REPORT
  </text>

  <!-- Outer QR Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
  <!-- Top Left -->
  <rect x="48" y="80" width="70" height="70" rx="8" fill="#1E293B"/>
  <rect x="58" y="90" width="50" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="68" y="100" width="30" height="30" rx="4" fill="url(#goldGrad)"/>

  <!-- Top Right -->
  <rect x="282" y="80" width="70" height="70" rx="8" fill="#1E293B"/>
  <rect x="292" y="90" width="50" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="302" y="100" width="30" height="30" rx="4" fill="url(#goldGrad)"/>

  <!-- Bottom Left -->
  <rect x="48" y="270" width="70" height="70" rx="8" fill="#1E293B"/>
  <rect x="58" y="280" width="50" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="68" y="290" width="30" height="30" rx="4" fill="url(#goldGrad)"/>

