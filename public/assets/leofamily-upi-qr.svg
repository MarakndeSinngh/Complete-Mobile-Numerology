    <rect x="150" y="80" width="24" height="12" rx="2"/>
    <rect x="190" y="80" width="12" height="12" rx="2"/>
    <rect x="210" y="80" width="12" height="12" rx="2"/>
    <rect x="235" y="80" width="24" height="12" rx="2"/>

    <!-- Row 2 modules -->
    <rect x="130" y="100" width="24" height="12" rx="2"/>
    <rect x="170" y="100" width="12" height="12" rx="2"/>
    <rect x="200" y="100" width="24" height="12" rx="2"/>
    <rect x="245" y="100" width="12" height="12" rx="2"/>

    <!-- Row 3 modules -->
